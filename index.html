<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>User Directory</title>

  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    h1 {
      text-align: center;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      font-weight: bold;
    }

    #users {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 0;
      list-style: none;
    }

    .user-card {
      padding: 15px;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .user-card h2 {
      margin-top: 0;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <h1>User Directory</h1>

  <button id="loadButton">Load Users</button>

  <p id="message">Click the button to load users.</p>

  <div id="output"></div>

  <script src="app.js"></script>
</body>
</html>
